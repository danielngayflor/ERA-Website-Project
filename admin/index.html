<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERA Content Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forest: #1a3a0e;
      --olive: #e0e69f;
      --terra: #b84d24;
      --bg: #f5f5f0;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #666;
      --border: #ddd;
      --radius: 8px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Login screen ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .login-card {
      background: var(--card); border-radius: var(--radius); padding: 2.5rem;
      max-width: 480px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .login-card h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--forest); margin-bottom: .3rem; }
    .login-card p { color: var(--muted); font-size: .9rem; margin-bottom: 1.8rem; line-height: 1.6; }
    .login-card label { display: block; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--forest); margin-bottom: .4rem; }
    .login-card input { width: 100%; padding: .7rem .9rem; border: 1.5px solid var(--border); border-radius: 6px; font-size: .95rem; outline: none; }
    .login-card input:focus { border-color: var(--forest); }
    .login-hint { font-size: .78rem; color: var(--muted); margin-top: .5rem; line-height: 1.5; }
    .login-hint a { color: var(--terra); }
    #loginError { color: var(--terra); font-size: .85rem; margin-top: .8rem; display: none; }

    /* ── App shell ── */
    #app { display: none; }
    .topbar {
      background: var(--forest); color: #fff; padding: .9rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar__brand { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--olive); }
    .topbar__user { font-size: .8rem; color: rgba(255,255,255,.7); display: flex; align-items: center; gap: 1rem; }
    .topbar__user button { background: none; border: 1px solid rgba(255,255,255,.3); color: #fff; padding: .3rem .7rem; border-radius: 4px; cursor: pointer; font-size: .78rem; }

    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 52px); }

    .sidebar { background: var(--forest); padding: 1.5rem 0; }
    .sidebar nav a {
      display: block; padding: .7rem 1.5rem; color: rgba(255,255,255,.75);
      text-decoration: none; font-size: .88rem; transition: .15s;
      border-left: 3px solid transparent;
    }
    .sidebar nav a:hover { color: #fff; background: rgba(255,255,255,.06); }
    .sidebar nav a.active { color: var(--olive); border-left-color: var(--olive); background: rgba(255,255,255,.05); font-weight: 600; }
    .sidebar nav .nav-section { padding: .9rem 1.5rem .3rem; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.35); }

    .main { padding: 2rem; overflow-y: auto; }

    /* ── Panels ── */
    .panel { display: none; }
    .panel.active { display: block; }

    .panel-header { margin-bottom: 1.5rem; }
    .panel-header h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--forest); }
    .panel-header p { color: var(--muted); font-size: .88rem; margin-top: .3rem; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .55rem 1.1rem; border-radius: 6px; font-size: .88rem; font-weight: 600; cursor: pointer; border: none; transition: .15s; }
    .btn-primary { background: var(--forest); color: #fff; }
    .btn-primary:hover { background: #0f2408; }
    .btn-terra { background: var(--terra); color: #fff; }
    .btn-terra:hover { background: #9a3d1a; }
    .btn-outline { background: none; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--forest); color: var(--forest); }
    .btn-danger { background: none; border: 1.5px solid #e55; color: #c33; }
    .btn-danger:hover { background: #fee; }
    .btn-sm { padding: .35rem .75rem; font-size: .8rem; }

    /* ── Card list ── */
    .item-list { display: flex; flex-direction: column; gap: .75rem; margin-bottom: 1.5rem; }
    .item-card {
      background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 1rem 1.2rem; display: flex; align-items: center; gap: 1rem;
      transition: border-color .15s;
    }
    .item-card:hover { border-color: var(--forest); }
    .item-card__info { flex: 1; min-width: 0; }
    .item-card__title { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-card__meta { font-size: .8rem; color: var(--muted); margin-top: .15rem; }
    .item-card__actions { display: flex; gap: .5rem; flex-shrink: 0; }
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 3px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .badge-published { background: #d4edda; color: #155724; }
    .badge-draft { background: #fff3cd; color: #856404; }

    /* ── Form ── */
    .form-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
    .form-row { margin-bottom: 1.2rem; }
    .form-row label { display: block; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--forest); margin-bottom: .4rem; }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%; padding: .6rem .85rem; border: 1.5px solid var(--border);
      border-radius: 6px; font-size: .92rem; font-family: inherit; outline: none;
      background: #fff; resize: vertical;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--forest); }
    .form-row .hint { font-size: .77rem; color: var(--muted); margin-top: .3rem; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-actions { display: flex; gap: .75rem; margin-top: 1.5rem; padding-top: 1.2rem; border-top: 1px solid var(--border); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--forest); color: #fff;
      padding: .8rem 1.2rem; border-radius: 6px; font-size: .88rem;
      transform: translateY(80px); opacity: 0; transition: .3s; z-index: 999;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.error { background: var(--terra); }

    /* ── Toggle switch ── */
    .toggle-row { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.2rem; }
    .toggle-row .toggle-label { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--forest); }
    .toggle { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 24px; cursor: pointer; transition: .2s; }
    .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .toggle input:checked + .toggle-slider { background: var(--forest); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

    /* ── Image upload area ── */
    .img-upload-area {
      border: 2px dashed var(--border); border-radius: var(--radius); padding: 1.2rem;
      text-align: center; cursor: pointer; transition: .15s; background: #fafafa;
      position: relative;
    }
    .img-upload-area:hover { border-color: var(--forest); background: #f0f4ee; }
    .img-upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    .img-upload-area .upload-icon { font-size: 1.8rem; margin-bottom: .3rem; }
    .img-upload-area .upload-text { font-size: .85rem; color: var(--muted); }
    .img-preview { margin-top: .75rem; position: relative; display: inline-block; }
    .img-preview img { max-height: 140px; max-width: 100%; border-radius: 6px; border: 1px solid var(--border); display: block; }
    .img-preview .remove-img { position: absolute; top: -8px; right: -8px; background: var(--terra); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: .8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }

    /* ── Rich text editor ── */
    .rte-toolbar { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .4rem; }
    .rte-btn { background: #f4f4f0; border: 1px solid var(--border); border-radius: 4px; padding: .25rem .55rem; font-size: .8rem; font-weight: 700; cursor: pointer; line-height: 1.4; color: var(--text); }
    .rte-btn:hover { background: var(--forest); color: #fff; border-color: var(--forest); }
    .rte-body { min-height: 220px; border: 1.5px solid var(--border); border-radius: 6px; padding: .75rem .9rem; font-size: .93rem; font-family: inherit; line-height: 1.7; outline: none; background: #fff; }
    .rte-body:focus { border-color: var(--forest); }
    .rte-body h2 { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; margin: 1rem 0 .4rem; color: var(--forest); }
    .rte-body h3 { font-size: 1rem; font-weight: 700; margin: .9rem 0 .3rem; }
    .rte-body p  { margin-bottom: .75rem; }
    .rte-body ul, .rte-body ol { padding-left: 1.4rem; margin-bottom: .75rem; }
    .rte-body blockquote { border-left: 3px solid var(--terra); padding-left: .9rem; color: var(--muted); font-style: italic; margin: .75rem 0; }
    .rte-hint { font-size: .77rem; color: var(--muted); margin-top: .3rem; }

    /* ── Category tile picker ── */
    .cat-picker { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .2rem; }
    .cat-tile { display: flex; align-items: center; gap: .5rem; padding: .45rem .85rem; border: 1.5px solid var(--border); border-radius: 6px; cursor: pointer; font-size: .85rem; font-weight: 500; transition: .15s; user-select: none; background: #fff; }
    .cat-tile input[type=radio] { accent-color: var(--forest); width: 15px; height: 15px; flex-shrink: 0; cursor: pointer; }
    .cat-tile:has(input:checked) { border-color: var(--forest); background: #f0f4ee; color: var(--forest); font-weight: 700; }

    /* ── Loading ── */
    .loading { text-align: center; padding: 3rem; color: var(--muted); }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .form-grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════
     LOGIN SCREEN
════════════════════════════════════════════════════════ -->
<div id="loginScreen">
  <div class="login-card">
    <h1>ERA Content Manager</h1>
    <p>Sign in to manage website content.</p>
    <label for="emailInput">Email</label>
    <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email" />
    <br/><br/>
    <label for="passwordInput">Password</label>
    <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" />
    <div id="loginError">Incorrect email or password.</div>
    <br />
    <button class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center;">Sign In →</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════
     MAIN APP
════════════════════════════════════════════════════════ -->
<div id="app">
  <div class="topbar">
    <span class="topbar__brand">ERA Content Manager</span>
    <div class="topbar__user">
      <span id="userLabel"></span>
      <button id="logoutBtn">Sign out</button>
    </div>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <div class="nav-section">Content</div>
        <a href="#" data-panel="resources" class="nav-link active">📰 Resources</a>
        <a href="#" data-panel="campaigns" class="nav-link">📣 Campaigns</a>
        <a href="#" data-panel="team" class="nav-link">👥 Team Members</a>
        <a href="#" data-panel="partners" class="nav-link">🤝 Partners & Donors</a>
      </nav>
    </aside>
    <main class="main" id="mainContent">
      <!-- Panels injected here -->
    </main>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const REPO = 'danielngayflor/ERA-Website-Project';
const BRANCH = 'main';
const FILES = {
  resources: 'content/resources.json',
  campaigns: 'content/campaigns.json',
  team:      'content/team.json',
  partners:  'content/partners.json',
};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let jwtToken = '';
let jwtExpiry = 0;
let currentPanel = 'resources';
let contentData = {};
let fileSHAs = {};
let loginAttempts = 0;
let loginLockedUntil = 0;

// ═══════════════════════════════════════════════════════════
// GITHUB API  (routed through /api/github — PAT never in browser)
// ═══════════════════════════════════════════════════════════
async function ghFetch(ghPath, opts = {}) {
  const [pathname, qs] = ghPath.split('?');
  const proxyUrl = '/api/github?path=' + encodeURIComponent(pathname) + (qs ? '&' + qs : '');
  const res = await fetch(proxyUrl, {
    method: opts.method || 'GET',
    headers: {
      'Authorization': 'Bearer ' + jwtToken,
      'Content-Type':  'application/json',
    },
    body: opts.body || undefined,
  });
  if (res.status === 401) {
    logout();
    throw new Error('Session expired — please sign in again.');
  }
  if (!res.ok) throw new Error(`GitHub API ${res.status}: ${await res.text()}`);
  return res.json();
}

async function getFile(key) {
  const data = await ghFetch(`/repos/${REPO}/contents/${FILES[key]}?ref=${BRANCH}`);
  fileSHAs[key] = data.sha;
  const bytes = Uint8Array.from(atob(data.content.replace(/\n/g,'')), c => c.charCodeAt(0));
  const json = JSON.parse(new TextDecoder().decode(bytes));
  contentData[key] = json;
  return json;
}

async function saveFile(key, json, message) {
  // Always fetch the latest SHA before saving to avoid 409 conflicts
  await getFile(key);
  const str = JSON.stringify(json, null, 2);
  const bytes = new TextEncoder().encode(str);
  const content = btoa(String.fromCharCode(...bytes));
  await ghFetch(`/repos/${REPO}/contents/${FILES[key]}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content, sha: fileSHAs[key], branch: BRANCH }),
  });
  await getFile(key);
}

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('logoutBtn').addEventListener('click', logout);

async function login() {
  const now = Date.now();
  if (now < loginLockedUntil) {
    const s = Math.ceil((loginLockedUntil - now) / 1000);
    showLoginError('Too many failed attempts. Try again in ' + s + ' seconds.');
    return;
  }

  const email    = document.getElementById('emailInput').value.trim().toLowerCase();
  const password = document.getElementById('passwordInput').value;
  if (!email || !password) return;

  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Signing in…';
  btn.disabled = true;
  document.getElementById('loginError').style.display = 'none';

  try {
    const res = await fetch('/api/login', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, password }),
    });

    if (!res.ok) {
      loginAttempts++;
      if (loginAttempts >= 3) {
        loginLockedUntil = Date.now() + 30000;
        loginAttempts = 0;
        showLoginError('Too many failed attempts. Locked for 30 seconds.');
      } else {
        showLoginError('Incorrect email or password.');
      }
      btn.textContent = 'Sign In →';
      btn.disabled = false;
      return;
    }

    loginAttempts = 0;
    const { token, expiresAt } = await res.json();
    jwtToken  = token;
    jwtExpiry = expiresAt;
    localStorage.setItem('era_cms_token',  token);
    localStorage.setItem('era_cms_expiry', String(expiresAt));
    localStorage.setItem('era_cms_email',  email);
    localStorage.removeItem('era_cms_session'); // clear old session flag

    document.getElementById('userLabel').textContent = email;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadPanel('resources');
  } catch(e) {
    showLoginError('Connection error. Please try again.');
    btn.textContent = 'Sign In →';
    btn.disabled = false;
  }
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

function logout() {
  jwtToken  = '';
  jwtExpiry = 0;
  localStorage.removeItem('era_cms_token');
  localStorage.removeItem('era_cms_expiry');
  localStorage.removeItem('era_cms_email');
  localStorage.removeItem('era_cms_session');
  contentData = {};
  fileSHAs    = {};
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('emailInput').value  = '';
  document.getElementById('passwordInput').value = '';
}

// Auto-login if a valid (non-expired) token is stored
(function() {
  const storedToken  = localStorage.getItem('era_cms_token');
  const storedExpiry = parseInt(localStorage.getItem('era_cms_expiry') || '0', 10);
  const storedEmail  = localStorage.getItem('era_cms_email') || 'Admin';
  if (storedToken && storedExpiry > Date.now()) {
    jwtToken  = storedToken;
    jwtExpiry = storedExpiry;
    ghFetch('/user').then(() => {
      document.getElementById('userLabel').textContent = storedEmail;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadPanel('resources');
    }).catch(() => {
      jwtToken  = '';
      jwtExpiry = 0;
      localStorage.removeItem('era_cms_token');
      localStorage.removeItem('era_cms_expiry');
    });
  } else {
    // Clear any stale tokens
    localStorage.removeItem('era_cms_token');
    localStorage.removeItem('era_cms_expiry');
    localStorage.removeItem('era_cms_session');
  }
})();

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.nav-link').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    a.classList.add('active');
    loadPanel(a.dataset.panel);
  });
});

function loadPanel(name) {
  currentPanel = name;
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading">Loading…</div>';
  let p;
  if (name === 'resources') p = renderResourcesPanel();
  else if (name === 'campaigns') p = renderCampaignsPanel();
  else if (name === 'team') p = renderTeamPanel();
  else if (name === 'partners') p = renderPartnersPanel();
  if (p && p.catch) p.catch(err => {
    const errEl = document.createElement('div');
    errEl.style.cssText = 'color:var(--terra);padding:1.5rem;background:var(--card);border-radius:var(--radius);border:1.5px solid var(--terra);';
    errEl.innerHTML = '<strong>Error loading panel:</strong><br>';
    errEl.appendChild(document.createTextNode(err.message || String(err)));
    main.innerHTML = '';
    main.appendChild(errEl);
  });
}

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', 3000);
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ═══════════════════════════════════════════════════════════
// IMAGE UPLOAD HELPER
// ═══════════════════════════════════════════════════════════

// Renders an image upload widget into containerId.
// existingPath: current value from JSON (e.g. "images/photo.jpg") or ''
// constraints: { maxKB, ratioW, ratioH, ratioLabel, hint }  — all optional
// Returns object with getPath() to read current value before save.
function renderImageWidget(containerId, existingPath, constraints) {
  const el = document.getElementById(containerId);
  const cfg = constraints || {};
  let currentPath = existingPath || '';
  let pendingFile = null;
  let validationError = '';

  function validateImage(file, dataUrl) {
    return new Promise(resolve => {
      if (cfg.maxKB && file.size > cfg.maxKB * 1024) {
        resolve(`File is ${(file.size/1024).toFixed(0)} KB — maximum allowed is ${cfg.maxKB} KB. Please compress or resize the image.`);
        return;
      }
      if (cfg.ratioW && cfg.ratioH) {
        const img = new Image();
        img.onload = () => {
          const actualRatio = img.width / img.height;
          const targetRatio = cfg.ratioW / cfg.ratioH;
          const tolerance = 0.08;
          if (Math.abs(actualRatio - targetRatio) > tolerance) {
            resolve(`Image dimensions are ${img.width}×${img.height}px (ratio ${(actualRatio).toFixed(2)}:1). Required ratio is ${cfg.ratioLabel || cfg.ratioW+':'+cfg.ratioH} — please crop to that ratio before uploading.`);
          } else {
            resolve('');
          }
        };
        img.src = dataUrl;
      } else {
        resolve('');
      }
    });
  }

  function render() {
    el.innerHTML = `
      <div class="img-upload-area" id="${containerId}_drop">
        <input type="file" id="${containerId}_file" accept="image/*" />
        <div class="upload-icon">🖼️</div>
        <div class="upload-text">Click to choose an image — JPG, PNG, WebP${cfg.hint ? '<br><span style="font-size:.75rem;opacity:.7;">'+cfg.hint+'</span>' : ''}</div>
      </div>
      ${validationError ? `<p style="font-size:.82rem;color:var(--terra);margin-top:.5rem;line-height:1.5;">⚠️ ${validationError}</p>` : ''}
      ${(currentPath || pendingFile) && !validationError ? `
        <div class="img-preview" id="${containerId}_preview">
          <img src="${pendingFile ? pendingFile.dataUrl : currentPath}" alt="preview" />
          <button class="remove-img" id="${containerId}_remove" title="Remove image">×</button>
        </div>` : ''}
      ${currentPath && !pendingFile && !validationError ? `<p style="font-size:.78rem;color:var(--muted);margin-top:.4rem;">Current: ${currentPath}</p>` : ''}
      ${pendingFile && !validationError ? `<p style="font-size:.78rem;color:#155724;margin-top:.4rem;">✓ Ready to upload: ${pendingFile.name}</p>` : ''}`;

    document.getElementById(`${containerId}_file`).addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async ev => {
        const err = await validateImage(file, ev.target.result);
        if (err) {
          validationError = err;
          pendingFile = null;
          render();
          return;
        }
        validationError = '';
        pendingFile = { name: file.name, dataUrl: ev.target.result, file };
        currentPath = '';
        render();
      };
      reader.readAsDataURL(file);
    });

    const removeBtn = document.getElementById(`${containerId}_remove`);
    if (removeBtn) removeBtn.addEventListener('click', () => {
      currentPath = ''; pendingFile = null; render();
    });
  }

  render();

  return {
    async getPath() {
      if (!pendingFile) return currentPath;
      // Upload file to GitHub images/ folder
      const arrayBuf = await pendingFile.file.arrayBuffer();
      const bytes = new Uint8Array(arrayBuf);
      const b64 = btoa(String.fromCharCode(...bytes));
      const filename = pendingFile.name.replace(/[^a-zA-Z0-9._-]/g, '-');
      const path = `images/${filename}`;
      // Check if file exists to get its SHA (avoids 422 on duplicate name)
      let sha;
      try {
        const existing = await ghFetch(`/repos/${REPO}/contents/${path}`);
        sha = existing.sha;
      } catch(e) { /* new file */ }
      await ghFetch(`/repos/${REPO}/contents/${path}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `CMS: upload image ${filename}`,
          content: b64,
          branch: BRANCH,
          ...(sha ? { sha } : {}),
        }),
      });
      currentPath = path;
      pendingFile = null;
      return path;
    }
  };
}

async function saveResource(index, imgWidget, status) {
  const resources = contentData.resources.resources;
  const title = document.getElementById('f_title').value.trim();
  if (!title) { toast('Title is required', true); return; }

  const activeBtn = status === 'published'
    ? document.getElementById('publishBtn')
    : document.getElementById('saveDraftBtn');
  const originalText = activeBtn.textContent;
  activeBtn.textContent = 'Uploading…'; activeBtn.disabled = true;

  const hasImage = document.getElementById('f_hasImage').checked;
  let imagePath = undefined;
  if (hasImage && imgWidget) {
    try { imagePath = await imgWidget.getPath() || undefined; }
    catch(e) { toast('Image upload failed: ' + e.message, true); activeBtn.textContent=originalText; activeBtn.disabled=false; return; }
  }

  const bodyEl = document.getElementById('f_body');
  const bodyHtml = bodyEl ? bodyEl.innerHTML.trim() : '';

  const item = {
    id: index >= 0 ? resources[index].id : title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g,''),
    category: (document.querySelector('input[name="f_category"]:checked') || {}).value || 'story',
    tag: document.getElementById('f_tag').value.trim(),
    title,
    meta: document.getElementById('f_meta').value.trim(),
    excerpt: document.getElementById('f_excerpt').value.trim(),
    body: bodyHtml || undefined,
    image: imagePath,
    imageAlt: hasImage ? (document.getElementById('f_imageAlt').value.trim() || undefined) : undefined,
    linkUrl: document.getElementById('f_linkUrl').value.trim() || undefined,
    linkLabel: document.getElementById('f_linkLabel').value.trim() || undefined,
    downloadUrl: document.getElementById('f_downloadUrl').value.trim() || undefined,
    externalBadge: document.getElementById('f_externalBadge').value === 'true' || undefined,
    status: status || 'draft',
  };
  // Remove undefined keys
  Object.keys(item).forEach(k => item[k] === undefined && delete item[k]);

  if (index >= 0) resources[index] = item;
  else resources.unshift(item);

  activeBtn.textContent = 'Saving…';
  try {
    const verb = status === 'published' ? 'publish' : 'save draft';
    await saveFile('resources', contentData.resources, `CMS: ${verb} resource "${title}"`);
    toast(status === 'published' ? '✓ Published! Live in ~1 minute.' : '✓ Saved as draft.');
    renderResourcesPanel();
  } catch(e) {
    toast('Save failed: ' + e.message, true);
    activeBtn.textContent = originalText; activeBtn.disabled = false;
  }
}

async function deleteResource(index) {
  const r = contentData.resources.resources[index];
  if (!confirm(`Delete "${r.title}"? This cannot be undone.`)) return;
  contentData.resources.resources.splice(index, 1);
  try {
    await saveFile('resources', contentData.resources, `CMS: delete resource "${r.title}"`);
    toast('✓ Deleted.');
    renderResourcesPanel();
  } catch(e) { toast('Delete failed: ' + e.message, true); }
}

        <button class="btn btn-primary" id="savePartnerBtn">💾 Save</button>
        <button class="btn btn-outline" onclick="renderPartnersPanel()">Cancel</button>
      </div>
    </div>`;

  let partnerLogoWidget = renderImageWidget('partnerLogoWidget', p.logo || '', { maxKB: 500, ratioW: 3, ratioH: 1, ratioLabel: '3:1 wide', hint: 'Max 500 KB · Wide logo (e.g. 600×200 px, 3:1 ratio)' });
  document.getElementById('f_hasLogo').addEventListener('change', e => {
    document.getElementById('partnerLogoSection').style.display = e.target.checked ? 'block' : 'none';
  });

  document.getElementById('savePartnerBtn').addEventListener('click', () => savePartner(index, partnerLogoWidget));
}

async function savePartner(index, logoWidget) {
  const list = contentData.partners.partners;
  const name = document.getElementById('f_name').value.trim();
  if (!name) { toast('Name is required', true); return; }

  const btn = document.getElementById('savePartnerBtn');
  btn.textContent = 'Uploading…'; btn.disabled = true;

  const hasLogo = document.getElementById('f_hasLogo').checked;
  let logoPath = undefined;
  if (hasLogo && logoWidget) {
    try { logoPath = await logoWidget.getPath() || undefined; }
    catch(e) { toast('Logo upload failed: ' + e.message, true); btn.textContent='💾 Save'; btn.disabled=false; return; }
  }

  const item = {
    id: index >= 0 ? list[index].id : name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''),
    name,
    logo: logoPath,
    url: document.getElementById('f_url').value.trim() || undefined,
  };
  Object.keys(item).forEach(k => item[k] === undefined && delete item[k]);

  if (index >= 0) list[index] = item;
  else list.push(item);

  btn.textContent = 'Saving…';
  try {
    await saveFile('partners', contentData.partners, `CMS: ${index>=0?'update':'add'} partner "${name}"`);
    toast('✓ Saved!');
    renderPartnersPanel();
  } catch(e) { toast('Save failed: ' + e.message, true); btn.textContent='💾 Save'; btn.disabled=false; }
}

async function deletePartner(index) {
  const p = contentData.partners.partners[index];
  if (!confirm(`Remove ${p.name}?`)) return;
  contentData.partners.partners.splice(index, 1);
  try {
    await saveFile('partners', contentData.partners, `CMS: remove partner "${p.name}"`);
    toast('✓ Removed.');
    renderPartnersPanel();
  } catch(e) { toast('Failed: ' + e.message, true); }
}

// ═══════════════════════════════════════════════════════════
// CAMPAIGNS PANEL
// ═══════════════════════════════════════════════════════════
async function renderCampaignsPanel() {
  const main = document.getElementById('mainContent');
  const data = contentData.campaigns || await getFile('campaigns');
  const campaigns = data.campaigns || [];

  main.innerHTML = `
    <div class="panel-header">
      <h2>Campaigns</h2>
      <p>Active campaigns shown on the Campaigns page.</p>
    </div>
    <button class="btn btn-primary" id="addCampaignBtn">+ Add Campaign</button>
    <br/><br/>
    <div class="item-list">
      ${campaigns.map((c, i) => `
        <div class="item-card">
          ${c.image ? `<img src="/${c.image}" style="width:56px;height:42px;object-fit:cover;border-radius:4px;flex-shrink:0;" />` : ''}
          <div class="item-card__info">
            <div class="item-card__title">${esc(c.title)}</div>
            <div class="item-card__meta">${esc(c.tag||'')}${c.tag && c.linkUrl ? ' · ' : ''}${esc(c.linkUrl||'')}</div>
          </div>
          <span class="badge badge-${c.status==='published'?'published':'draft'}">${c.status||'draft'}</span>
          <div class="item-card__actions">
            <button class="btn btn-outline btn-sm" onclick="editCampaign(${i})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteCampaign(${i})">Delete</button>
          </div>
        </div>`).join('')}
    </div>`;

  document.getElementById('addCampaignBtn').addEventListener('click', () => editCampaign(-1));
}

function editCampaign(index) {
  const campaigns = contentData.campaigns.campaigns || [];
  const c = index >= 0 ? campaigns[index] : {};
  const isNew = index < 0;
  const main = document.getElementById('mainContent');

  main.innerHTML = `
    <div class="panel-header">
      <h2>${isNew ? 'Add Campaign' : 'Edit Campaign'}</h2>
    </div>
    <div class="form-card">
      <div class="form-row">
        <label>Title *</label>
        <input id="f_title" value="${esc(c.title||'')}" placeholder="Campaign name" />
      </div>
      <div class="form-grid-2">
        <div class="form-row">
          <label>Tag label</label>
          <input id="f_tag" value="${esc(c.tag||'Campaign')}" placeholder="e.g. Campaign, Initiative" />
        </div>
        <div class="form-row">
          <label>Status *</label>
          <select id="f_status">
            <option value="published" ${c.status==='published'?'selected':''}>Published</option>
            <option value="draft" ${c.status!=='published'?'selected':''}>Draft (hidden)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Short description *</label>
        <textarea id="f_excerpt" rows="3" placeholder="1–2 sentence summary shown on campaign card">${esc(c.excerpt||'')}</textarea>
      </div>
      <div class="form-row">
        <label>Full description</label>
        <textarea id="f_description" rows="5" placeholder="Longer campaign description (optional)">${esc(c.description||'')}</textarea>
      </div>
      <div class="form-grid-2">
        <div class="form-row">
          <label>Link URL</label>
          <input id="f_linkUrl" value="${esc(c.linkUrl||'')}" placeholder="campaigns.html#section or https://..." />
          <p class="hint">Page anchor or full URL for the "Learn More" button</p>
        </div>
        <div class="form-row">
          <label>Link label</label>
          <input id="f_linkLabel" value="${esc(c.linkLabel||'Learn More →')}" />
        </div>
      </div>
      <div class="toggle-row">
        <label class="toggle">
          <input type="checkbox" id="f_hasImage" ${c.image ? 'checked' : ''} />
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-label">Campaign Image</span>
        <span style="font-size:.8rem;color:var(--muted);">Turn on to add a banner image</span>
      </div>
      <div id="campaignImageSection" style="display:${c.image ? 'block' : 'none'}">
        <div class="form-row">
          <label>Image alt text</label>
          <input id="f_imageAlt" value="${esc(c.imageAlt||'')}" placeholder="Describe the image for screen readers" />
        </div>
        <div class="form-row">
          <label>Image</label>
          <div id="campaignImageWidget"></div>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="saveCampaignBtn">💾 Save</button>
        <button class="btn btn-outline" onclick="renderCampaignsPanel()">Cancel</button>
      </div>
    </div>`;

  let campaignImgWidget = renderImageWidget('campaignImageWidget', c.image || '', { maxKB: 500, ratioW: 16, ratioH: 9, ratioLabel: '16:9', hint: 'Max 500 KB · 16:9 landscape (e.g. 1200×675 px)' });
  document.getElementById('f_hasImage').addEventListener('change', e => {
    document.getElementById('campaignImageSection').style.display = e.target.checked ? 'block' : 'none';
  });

  document.getElementById('saveCampaignBtn').addEventListener('click', () => saveCampaign(index, campaignImgWidget));
}

async function saveCampaign(index, imgWidget) {
  const campaigns = contentData.campaigns.campaigns;
  const title = document.getElementById('f_title').value.trim();
  if (!title) { toast('Title is required', true); return; }

  const btn = document.getElementById('saveCampaignBtn');
  btn.textContent = 'Uploading…'; btn.disabled = true;

  const hasImage = document.getElementById('f_hasImage').checked;
  let imagePath = undefined;
  if (hasImage && imgWidget) {
    try { imagePath = await imgWidget.getPath() || undefined; }
    catch(e) { toast('Image upload failed: ' + e.message, true); btn.textContent='💾 Save'; btn.disabled=false; return; }
  }

  const item = {
    id: index >= 0 ? campaigns[index].id : title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''),
    title,
    tag: document.getElementById('f_tag').value.trim() || undefined,
    excerpt: document.getElementById('f_excerpt').value.trim(),
    description: document.getElementById('f_description').value.trim() || undefined,
    image: imagePath,
    imageAlt: hasImage ? (document.getElementById('f_imageAlt').value.trim() || undefined) : undefined,
    linkUrl: document.getElementById('f_linkUrl').value.trim() || undefined,
    linkLabel: document.getElementById('f_linkLabel').value.trim() || undefined,
    status: document.getElementById('f_status').value,
  };
  Object.keys(item).forEach(k => item[k] === undefined && delete item[k]);

  if (index >= 0) campaigns[index] = item;
  else campaigns.unshift(item);

  btn.textContent = 'Saving…';
  try {
    await saveFile('campaigns', contentData.campaigns, `CMS: ${index>=0?'update':'add'} campaign "${title}"`);
    toast('✓ Saved!');
    renderCampaignsPanel();
  } catch(e) { toast('Save failed: ' + e.message, true); btn.textContent='💾 Save'; btn.disabled=false; }
}

async function deleteCampaign(index) {
  const c = contentData.campaigns.campaigns[index];
  if (!confirm(`Delete campaign "${c.title}"? This cannot be undone.`)) return;
  contentData.campaigns.campaigns.splice(index, 1);
  try {
    await saveFile('campaigns', contentData.campaigns, `CMS: delete campaign "${c.title}"`);
    toast('✓ Deleted.');
    renderCampaignsPanel();
  } catch(e) { toast('Failed: ' + e.message, true); }
}
</script>
